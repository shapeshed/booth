plugins {
    id 'com.android.application'
    id 'com.android.compose.screenshot'
    id 'jacoco'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jlleitschuh.gradle.ktlint'
}

ktlint {
    // Pin the ktlint CLI rather than inheriting the plugin's default so upgrades
    // are explicit. 1.8.0 parses the Kotlin 2.x sources, and is the version the
    // Compose ruleset below is built against.
    version = '1.8.0'
    android = true
    // Existing violations are recorded in app/config/ktlint/baseline.xml by
    // `./gradlew :app:ktlintGenerateBaseline`. Only new violations fail the build.
}

/**
 * Fails if the ktlint baseline contains any `standard` rule entry.
 *
 * A baseline entry is positional, so it breaks whenever anything above it shifts a line, and it
 * never ratchets: regenerating it is enough to make any new violation pass. That is tolerable for
 * the architectural rules the baseline is for, which are expensive to fix and genuinely
 * pre-existing, but not for formatting. Formatting violations are cheap to fix and baselining one
 * hides the same class of mistake in every later edit to that file, so the baseline is held to
 * `compose:` and `detekt:` entries only.
 *
 * The count is reported rather than merely asserted so the failure says what to look for.
 */
tasks.register('verifyKtlintBaselineHasNoFormattingEntries') {
    group = 'verification'
    description = 'Fails if the ktlint baseline contains formatting (standard) rule entries.'
    def baseline = layout.projectDirectory.file('config/ktlint/baseline.xml')
    inputs.file(baseline)
    def offenders = providers.provider {
        def text = baseline.asFile.text
        def matcher = (text =~ /source="(standard:[^"]+)"/)
        matcher.collect { it[1] }
    }
    doLast {
        def found = offenders.get()
        if (found) {
            throw new GradleException(
                "The ktlint baseline contains ${found.size()} formatting entries, which are for " +
                "fixing rather than recording:\n  " + found.unique().join('\n  ') +
                "\n\nFix them. If a standard rule is genuinely unusable here, that belongs in " +
                ".editorconfig or a reasoned @Suppress at the declaration, both of which survive " +
                "a line move. A baseline entry does not.")
        }
        logger.lifecycle('ktlint baseline holds no formatting entries.')
    }
}

android {
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
    namespace = 'com.shapeshed.booth'
    compileSdk 37

    // MigrationTestHelper reads the exported schemas from the test APK's assets, not from the
    // project directory, so without this every migration test fails with "Cannot find the schema
    // file in the assets folder" before it reaches any assertion. Found by running the v1 to v2
    // migration test on a device, which is the only place this shows up: it compiles and is absent
    // from the unit test source set entirely.
    sourceSets {
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }

    def releaseKeystoreFile = System.getenv("BOOTH_KEYSTORE_FILE")
    def releaseKeystorePassword = System.getenv("BOOTH_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("BOOTH_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("BOOTH_KEY_PASSWORD")
    def gitOutput = { List args ->
        providers.exec {
            commandLine "git", *args
        }.standardOutput.asText.get().trim()
    }
    def gitShortSha = gitOutput(["rev-parse", "--short=7", "HEAD"])
    def workingTreeDirty = gitOutput(["status", "--porcelain"])
    def exactTag = gitOutput(["tag", "--points-at", "HEAD"])
    def buildHash = (System.getenv("GITHUB_SHA") ?: gitShortSha).take(7)
    def buildLabel = System.getenv("BOOTH_BUILD_CHANNEL") == "nightly"
        ? "nightly-${buildHash}"
        : (workingTreeDirty && !exactTag ? "dirty-${buildHash}" : "")
    def hasReleaseSigning = releaseKeystoreFile &&
        releaseKeystorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

    defaultConfig {
        applicationId "com.shapeshed.booth"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "BUILD_LABEL", "\"${buildLabel}\""
        testInstrumentationRunner "com.shapeshed.booth.testing.BoothTestRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        deviceTest {
            initWith debug
            applicationIdSuffix ".deviceTest"
            matchingFallbacks = ['debug']
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        productionDebugKey {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
        }
    }

    testBuildType = "deviceTest"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        fatal 'UnusedResources'
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha29'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // Adaptive list-detail layout (not part of the Compose BOM — versioned separately).
    def adaptiveVersion = '1.3.0'
    implementation "androidx.compose.material3.adaptive:adaptive:$adaptiveVersion"
    implementation "androidx.compose.material3.adaptive:adaptive-layout:$adaptiveVersion"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation:$adaptiveVersion"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation3:$adaptiveVersion"

    // Navigation 3 owns the Compose back stack and enables adaptive scene layouts.
    def navigation3Version = '1.2.0'
    implementation "androidx.navigation3:navigation3-runtime:$navigation3Version"
    implementation "androidx.navigation3:navigation3-ui:$navigation3Version"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.11.0'

    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'
    implementation 'io.coil-kt.coil3:coil-svg:3.6.3'
    implementation 'me.saket.telephoto:zoomable-image-coil3:0.19.0'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'
    kspAndroidTest 'com.google.dagger:hilt-android-compiler:2.60.1'
    implementation 'org.jsoup:jsoup:1.23.1'
    implementation 'com.prof18.rssparser:rssparser:6.1.8'
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    implementation "androidx.room:room-paging:$roomVersion"
    implementation 'androidx.paging:paging-compose:3.5.1'
    ksp "androidx.room:room-compiler:$roomVersion"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    // android.jar's org.json is a stub: with returnDefaultValues = true, JSONObject parses
    // nothing and every opt* accessor returns null, so JSON-parsing code under test silently
    // returns empty. The real implementation is required for unit tests to be able to fail.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    deviceTestImplementation 'androidx.compose.ui:ui-test-manifest'
    // Currently unused: the schema was squashed to v1 before the first release, so there are no
    // migrations to test. Kept deliberately, because the next schema change needs
    // MigrationTestHelper and a test that only compiles once someone remembers to add it is a
    // test that will not be written.
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    screenshotTestImplementation 'com.android.tools.screenshot:screenshot-validation-api:0.0.1-alpha16'
    screenshotTestImplementation 'androidx.compose.ui:ui-tooling'

    // Jetpack Compose lint rules for ktlint (modifier ordering, state hoisting,
    // parameter ordering, ...). These enforce the Compose conventions described
    // in AGENTS.md.
    ktlintRuleset 'io.nlopez.compose.rules:ktlint:0.6.7'
}

tasks.register("jacocoDeviceTestUnitTestReport", JacocoReport) {
    dependsOn("testDeviceTestUnitTest")
    group = "verification"
    description = "Generates JaCoCo coverage for local deviceTest unit tests."
    executionData.from(fileTree(layout.buildDirectory).include(
        "jacoco/testDeviceTestUnitTest.exec",
        "outputs/unit_test_code_coverage/deviceTestUnitTest/testDeviceTestUnitTest.exec",
    ))
    sourceDirectories.from(files("src/main/java", "src/main/kotlin"))
    classDirectories.from(fileTree(layout.buildDirectory) {
        include("intermediates/built_in_kotlinc/deviceTest/compileDeviceTestKotlin/classes/**/*.class")
        include("intermediates/javac/deviceTest/compileDeviceTestJavaWithJavac/classes/**/*.class")
        include("tmp/kotlin-classes/deviceTest/**/*.class")
        exclude('**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*')
    })
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.register("jacocoDeviceTestUnitTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn("testDeviceTestUnitTest")
    group = "verification"
    // Named "unit" deliberately. This gate measures JVM unit tests only, so it does not see the
    // instrumentation suite. PodcastRepository reads 0% here despite having instrumentation tests,
    // and a change that breaks it can pass this floor while the report still shows nothing. Read
    // it as "unit-test line coverage", not as coverage of the app.
    description = "Verifies deviceTest JVM unit-test line coverage. Excludes instrumentation."
    executionData.from(fileTree(layout.buildDirectory).include(
        "jacoco/testDeviceTestUnitTest.exec",
        "outputs/unit_test_code_coverage/deviceTestUnitTest/testDeviceTestUnitTest.exec",
    ))
    classDirectories.from(fileTree(layout.buildDirectory) {
        include("intermediates/built_in_kotlinc/deviceTest/compileDeviceTestKotlin/classes/**/*.class")
        include("intermediates/javac/deviceTest/compileDeviceTestJavaWithJavac/classes/**/*.class")
        include("tmp/kotlin-classes/deviceTest/**/*.class")
        exclude('**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*')
    })
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                // Measured 2026-09-28: 1,444 / 18,610 lines (7.76%). Previously 7.05% on
                // 2026-09-05, which the codebase outgrew by more than 1,600 lines while the floor
                // sat unchanged and gated almost nothing.
                //
                // Raise this floor with each coverage batch; never let the report pass empty. This
                // number is low because the orchestration layer is untested, not because the
                // deterministic logic is. See docs/architecture-and-coverage-plan.md.
                minimum = 0.077
            }
        }
    }
}

// The standard connected test task may uninstall the target package as part of its
// device cleanup. Use this task for a personal device when its app data must remain.
tasks.register("preservingDebugAndroidTest") {
    dependsOn("assembleDeviceTest", "assembleDeviceTestAndroidTest")
    def appApkPath = layout.buildDirectory.file("outputs/apk/deviceTest/app-deviceTest.apk").get().asFile.absolutePath
    def testApkPath = layout.buildDirectory.file("outputs/apk/androidTest/deviceTest/app-deviceTest-androidTest.apk").get().asFile.absolutePath

    doLast {
        def adb = System.getenv("ADB") ?: "adb"
        def runAdb = { List<String> arguments ->
            def process = new ProcessBuilder(([adb] + arguments).collect { it.toString() })
                .inheritIO()
                .start()
            if (process.waitFor() != 0) {
                throw new GradleException("ADB command failed: ${arguments.join(' ')}")
            }
        }

        runAdb(["install", "-r", appApkPath])
        runAdb(["install", "-r", testApkPath])
        runAdb(["shell", "am", "instrument", "-w",
                "-e", "clearPackageData", "false",
                "-e", "disableAnalytics", "true",
                "com.shapeshed.booth.deviceTest.test/com.shapeshed.booth.testing.BoothTestRunner"])
    }
}
