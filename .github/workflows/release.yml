name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          BOOTH_KEYSTORE_BASE64: ${{ secrets.BOOTH_KEYSTORE_BASE64 }}
          BOOTH_KEYSTORE_PASSWORD: ${{ secrets.BOOTH_KEYSTORE_PASSWORD }}
          BOOTH_KEY_ALIAS: ${{ secrets.BOOTH_KEY_ALIAS }}
          BOOTH_KEY_PASSWORD: ${{ secrets.BOOTH_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$BOOTH_KEYSTORE_BASE64" ] ||
             [ -z "$BOOTH_KEYSTORE_PASSWORD" ] ||
             [ -z "$BOOTH_KEY_ALIAS" ] ||
             [ -z "$BOOTH_KEY_PASSWORD" ]; then
            echo "All Booth signing secrets are required for releases." >&2
            exit 1
          fi
          printf '%s' "$BOOTH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/booth-release.jks"

      - name: Run release checks and build artifacts
        env:
          BOOTH_KEYSTORE_FILE: ${{ runner.temp }}/booth-release.jks
          BOOTH_KEYSTORE_PASSWORD: ${{ secrets.BOOTH_KEYSTORE_PASSWORD }}
          BOOTH_KEY_ALIAS: ${{ secrets.BOOTH_KEY_ALIAS }}
          BOOTH_KEY_PASSWORD: ${{ secrets.BOOTH_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease

      - name: Prepare release assets
        run: |
          set -eu
          tag="${GITHUB_REF_NAME:-manual}"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          mkdir -p app/build/release-assets
          cp "$apk" "app/build/release-assets/booth-${tag}.apk"
          sha256sum app/build/release-assets/* > app/build/release-assets/SHA256SUMS

      - name: Generate build provenance
        if: startsWith(github.ref, 'refs/tags/')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: app/build/release-assets/booth-*.apk

      - name: Add build provenance to release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          install -m 0644 "${{ steps.attest.outputs.bundle-path }}" \
            "app/build/release-assets/booth-${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Generate SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: app/build/release-assets/booth-${{ github.ref_name }}.apk
          format: cyclonedx-json
          output-file: app/build/release-assets/booth-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: booth-release-assets
          path: app/build/release-assets/*
          if-no-files-found: error

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: app/build/release-assets/*
          draft: true
          generate_release_notes: true
