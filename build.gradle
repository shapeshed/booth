plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.compose.screenshot' version '0.0.1-alpha16' apply false
    id 'com.google.devtools.ksp' version '2.3.12' apply false
    id 'com.google.dagger.hilt.android' version '2.60.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0' apply false
}

tasks.register('quality') {
    group = 'verification'
    description = 'Runs the maintenance quality gate for compile errors, formatting, lint, unit tests, and coverage.'
    dependsOn(
        ':app:compileDebugKotlin',
        // The androidTest source set is a separate compilation that nothing above pulls in, so a
        // rename in main can leave instrumentation referencing a parameter that no longer exists and
        // still pass this gate. It happened: a renamed composable parameter was green locally and on
        // CI, and only failed when the device job compiled it. This costs a few seconds and catches
        // it here instead.
        ':app:compileDeviceTestAndroidTestKotlin',
        ':app:lintDebug',
        ':app:ktlintCheck',
        ':app:verifyKtlintBaselineHasNoFormattingEntries',
        ':app:testDeviceTestUnitTest',
        ':app:jacocoDeviceTestUnitTestCoverageVerification',
    )
}
